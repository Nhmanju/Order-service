<VirtualHost *:80>
    ServerName ecom.local

    ProxyPreserveHost On
    
    # Route traffic to the Java microservice
    ProxyPass /api/orders http://127.0.0
    ProxyPassReverse /api/orders http://127.0.0

    ErrorLog "logs/ecom-error.log"
    CustomLog "logs/ecom-access.log" common
</VirtualHost>
